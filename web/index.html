<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local Visual Generator</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Local Visual Generator</h1>
      <p class="subtitle">Local CPU image generation · OpenVINO</p>
      <p id="status" class="status">Checking status…</p>
    </header>

    <section class="controls">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" rows="4" placeholder="a small house beside a lake"></textarea>

      <fieldset>
        <legend>Style</legend>
        <div class="option-row" id="type-options">
          <button type="button" class="option selected" data-type="illustration">Illustration</button>
          <button type="button" class="option" data-type="anime">Anime</button>
          <button type="button" class="option" data-type="icon">Icon</button>
          <button type="button" class="option" data-type="logo">Logo</button>
          <button type="button" class="option" data-type="landscape">Landscape</button>
          <button type="button" class="option" data-type="free">Free</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Mode</legend>
        <div class="option-row" id="preset-options">
          <button type="button" class="option" data-preset="instant">Fast</button>
          <button type="button" class="option selected" data-preset="balanced">Balanced</button>
          <button type="button" class="option" data-preset="quality">Quality</button>
          <button type="button" class="option" data-preset="render">Render</button>
        </div>
      </fieldset>

      <details class="advanced">
        <summary>Advanced</summary>
        <div class="advanced-body">
          <fieldset>
            <legend>Size</legend>
            <div class="option-row" id="size-options">
              <button type="button" class="option" data-size="128x128">128×128</button>
              <button type="button" class="option" data-size="192x192">192×192</button>
              <button type="button" class="option selected" data-size="256x256">256×256</button>
              <button type="button" class="option" data-size="384x384">384×384</button>
              <button type="button" class="option" data-size="512x512">512×512</button>
              <button type="button" class="option" data-size="768x768">768×768</button>
              <button type="button" class="option" data-size="1024x1024">1024×1024</button>
              <button type="button" class="option" data-size="384x256">384×256</button>
              <button type="button" class="option" data-size="256x384">256×384</button>
              <button type="button" class="option" data-size="512x384">512×384</button>
              <button type="button" class="option" data-size="384x512">384×512</button>
              <button type="button" class="option" data-size="1024x768">1024×768</button>
              <button type="button" class="option" data-size="768x1024">768×1024</button>
            </div>
            <p id="size-hint" class="hint">Mode default: 256×256</p>
          </fieldset>

          <div class="steps-row">
            <label for="steps">Steps</label>
            <input id="steps" type="number" min="1" max="50" step="1" value="4" />
            <p id="steps-hint" class="hint">Mode default: 4</p>
          </div>

          <div class="seed-row">
            <label for="seed">Seed</label>
            <input id="seed" type="number" min="0" max="2147483647" value="42" />
            <button type="button" id="random-seed" class="secondary">Random</button>
          </div>
        </div>
      </details>

      <button type="button" id="generate" class="primary">Generate</button>
      <p id="error" class="error" hidden></p>
    </section>

    <section class="result" id="result" hidden>
      <img id="result-image" alt="Generated image" hidden />
      <div id="meta" class="meta" hidden></div>
      <div id="actions" class="actions" hidden>
        <a id="open-image" href="#" target="_blank" rel="noopener">Open</a>
        <a id="download-image" href="#" download>Save</a>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
